# ==============================================================================
# Supervisor Configuration for Laravel Reverb (WebSockets Server)
# File: /etc/supervisor/conf.d/starterkit-reverb.conf
# ==============================================================================

[program:starterkit-reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/starterkit_paradigma/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/starterkit-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
