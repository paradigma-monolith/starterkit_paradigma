# ==============================================================================
# Supervisor Configuration for Laravel Octane (RoadRunner High-Performance Worker)
# File: /etc/supervisor/conf.d/starterkit-octane.conf
# NOTE: Use this if you run Laravel Octane instead of standard PHP-FPM
# ==============================================================================

[program:starterkit-octane]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/starterkit_paradigma
command=php /var/www/starterkit_paradigma/artisan octane:start --server=roadrunner --host=127.0.0.1 --port=8000 --workers=auto --max-requests=1000
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/starterkit-octane.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600
