# ==============================================================================
# Nginx Server Configuration for Enterprise Starter Kit (Laravel 12 + Vue 3)
# File: /etc/nginx/sites-available/starterkit_paradigma
# ==============================================================================

# HTTP (Port 80) -> Redirect to HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/starterkit_paradigma/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (Port 443) - Main Application & WebSockets Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # Document Root (MUST point to Laravel public/ directory)
    root /var/www/starterkit_paradigma/public;
    index index.php index.html;

    # SSL Certificate Configuration (Certbot will manage these)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Character Set & Max Upload Size (Match Spatie MediaLibrary requirements)
    charset utf-8;
    client_max_body_size 64M;

    # Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression for Optimal Vue SPA & Assets Throughput
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Logging
    access_log /var/log/nginx/starterkit_access.log;
    error_log /var/log/nginx/starterkit_error.log error;

    # --------------------------------------------------------------------------
    # 1. Laravel Reverb WebSockets Reverse Proxy (WSS support)
    # --------------------------------------------------------------------------
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 2. Main Laravel & SPA Routing
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static Assets Caching (Vite build, images, fonts)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 3. PHP-FPM FastCGI Handler (Standard Laravel Deployment)
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        # For PHP 8.3 use: unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300s;
    }

    # Block access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
